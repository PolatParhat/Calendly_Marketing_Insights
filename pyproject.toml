[project]
name = "calendly-insights"
version = "0.1.0"
description = "Calendly bookings + marketing spend pipeline: Delta Lake on S3, metrics in Streamlit"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["src", "lambdas", "dashboard", "infra", "scripts"]  # lets tests import our modules without sys.path tricks
testpaths = ["tests", "infra/tests"]  # where pytest looks for test files

[tool.ruff]
target-version = "py311"
line-length = 100
