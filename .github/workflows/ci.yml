# CI (Continuous Integration): on every pull request to main, and every push to main,
# GitHub starts a fresh Linux machine, installs our tools, and runs lint + tests.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Java 17 (Spark 4 runs on the Java Virtual Machine)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pipeline libraries and dev tools
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v
